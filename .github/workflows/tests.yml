name: tests

on:
  push:
    branches: [fix/isin-anchor-universe-key-2011]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python 3.11 / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up locked Python environment
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          enable-cache: false
          activate-environment: true

      - name: Install locked package and test dependencies
        run: uv sync --locked --extra dev --extra reconcile

      - name: Run ISIN cutover regression test
        run: uv run pytest -q tests/test_universe.py::test_isin_cutover_anchor_preserves_rolling_window_and_raw_output_isin

      - name: Run complete test suite
        run: uv run pytest -q
